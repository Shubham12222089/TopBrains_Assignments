version: '3.4'

services:
  authservice:
    build: ./AuthService
    ports:
      - "5001:80"

  productservice:
    build: ./ProductService
    ports:
      - "5002:80"

  orderservice:
    build: ./OrderService
    ports:
      - "5003:80"

  apigateway:
    build: ./ApiGateway
    ports:
      - "5000:80"
    depends_on:
      - authservice
      - productservice
      - orderservice