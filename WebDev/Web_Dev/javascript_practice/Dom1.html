<!DOCTYPE html>
<head>
    <title>Employee Management App</title>
</head>
<body>
    <h1 id="title">Hello Students</h1>
    <button onclick="changeText()">Click Me!</button>
    <br>
    <p id="para">This is important Text</p>
    <button onclick="changeColor()">Change Color!</button>
    <br>
    <input type="password" id="pwd" placeholder="Password">
    <button onclick="PasswordToggle()">Show</button>

    <br>
    <ul id="List">
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
    </ul>
    <br>
    <br>
    <h2 id="count">0</h2>
    <button id="likeBtn">Like</button>
    <br>
    <br>
    <br>
    <button id="themeBtn">Toggle Theme</button>
    <style>
        .dark{
            /* background-color: rgb(0, 55, 255); */
            background-image: url("1460164.jpg");
            color: white;
        }
    </style>
    <script>
        function changeText(){
            document.getElementById("title").innerText = "Welcome to DOM class!";
        }
        function changeColor(){
            document.getElementById("para").style.color = "red";
        }
        //show or hide password
        function PasswordToggle(){
            let input=document.getElementById("pwd");
            if(input.type==="password"){
                input.type="text";
            }
            else{
                input.type="password";
            }
        }

        function addTask(){
            let taskValue = document.getElementById("taskInput").value;

        }
        let items = document.querySelectorAll("#List li");
        items.forEach(function(item){
            item.addEventListener("click",function(){
                item.remove();
            });
        });

        let count=0;
        document.getElementById("likeBtn").addEventListener("click", function(){
            count++;
            document.getElementById("count").innerText=count;
        });

        document.getElementById("themeBtn").addEventListener("click",function(){
            document.body.classList.toggle("dark");
        });
    </script>
</body>
</html>
