<!DOCTYPE html>
<head>
    <title>Employee Management App</title>
    <style>
        body{ 
            font-family: Arial;
            padding: 20px;
        }
        input,button{
            margin: 5px;
            padding: 5px;
        }
        .employee-card {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }

        .employee-card:hover {
            background-color: #f0f8ff;
        }
    </style>
</head>
<body>
    <h2> Employee Management App</h2>
    <h3>Add Employee</h3>
    <input type="text" id="name" placeholder="Name">
    <input type="text" id="dept" placeholder="Department">
    <input type="number" id="salary" placeholder="Salary">
    <button id="addBtn">Add Employee</button>

    <h3>Search Employee</h3>
    <input type="text" id="search" placeholder="Search">
    <h3>Employee List</h3>
    <div id="employeeList"></div>
    <h3>Salary Statistics</h3>
    <button id="totalSalaryBtn">Total Salary</button>
    <button id="avgSalaryBtn">Average Salary</button>
    <button id="highestSalaryBtn">Highest Paid</button>
    <p id="result"></p>
    <script>
        class Employee{
            constructor(id, name, dept, salary){
                this.id=id;
                this.name= name;
                this.dept = dept;
                this.salary=salary;
            }

            getAnnualSalary = () => this.salary*12;
        }

        let employees = []
        let idCounter=1;
        const displayEmployees = (list)=>{
            const container = document.getElementById("employeeList");
            container.innerHTML = "";

            list.array.forEach(emp => {
                const {id, name, dept, salary} = emp;
            });
            container.innerHTML+=`
            <div class="employee-card">
                <strong>${name}</strong><br>
                Dept: ${dept}<br>
                <button onclick="deleteEmployee(${id})">
                    Delete
                </button>
            </div>
            `;
        }
    </script>
</body>
</html>
